<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Resilience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<!-- Real map: MapLibre GL (open source) + OpenFreeMap tiles (OpenStreetMap data, free, no API key) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>/*CSS*/</style>
</head>
<body>
<div id="app">
  <!-- Pages: Home and Sources cover the map; the map keeps loading underneath (built by ui.js) -->
  <section id="home" class="page" aria-label="Home"></section>
  <section id="sources" class="page" aria-label="Sources"></section>
  <!-- Tabs on the map (wide screens) -->
  <nav id="mapnav" class="tabs" aria-label="Main"></nav>
  <!-- Map: real map when it loads, the illustrated SVG map otherwise (built by ui.js) -->
  <div id="realmap"></div>
  <svg id="map" aria-label="Map of San Pedro del Pinatar with the three model zones"></svg>

  <!-- Top left: crop search + season chips (design: "Select Crop / Plant") -->
  <div id="topleft">
    <button class="search" data-act="list" aria-haspopup="listbox">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F4A42" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span class="search-txt"><span class="lbl" data-i18n="selectCrop">Select Crop / Plant</span><span class="cropchip" id="cropchip"></span></span>
      <span class="chev" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </button>
    <div class="dropdown" id="croplist" role="listbox" hidden></div>
    <div class="chips" id="seasons"></div>
  </div>

  <!-- Map controls (design: zoom, locate, "Lenses") -->
  <div id="controls">
    <button class="ctl home-btn" data-act="page" data-page="home" data-i18n-aria="homeBtn" aria-label="Home"></button>
    <button class="ctl lang-btn" data-act="lang" aria-label="Language">ES</button>
    <button class="ctl themebtn" data-act="theme" aria-label="Theme"></button>
    <button class="ctl" data-act="zoom" data-i18n-aria="zoomIn" aria-label="Zoom in">+</button>
    <button class="ctl" data-act="locate" data-i18n-aria="resetView" aria-label="Reset map view">◎</button>
    <button class="ctl sat" data-act="sat" id="satbtn" data-i18n-aria="satView" aria-label="Satellite view" aria-pressed="false">🛰</button>
    <button class="lensbtn" data-act="lens" id="lensbtn">Lenses · Field Shift</button>
  </div>

  <!-- Field Shift lens -->
  <div id="lens" class="glass" hidden>
    <div class="lens-h" data-i18n="fieldShift">Field Shift</div>
    <p class="lens-p" data-i18n="lensIntro">What if the climate shifts? Every step is a full model run.</p>
    <label for="sT"><span data-i18n="warming">Warming</span> <b id="vT"></b></label>
    <input type="range" id="sT" min="0" max="4" step="1">
    <label for="sR"><span data-i18n="rain">Rain</span> <b id="vR"></b></label>
    <input type="range" id="sR" min="0" max="4" step="1">
    <div class="lens-btns"><button class="lnk" data-act="reset" data-i18n="reset">Reset to measured climate</button><button class="done" data-act="lens" data-i18n="done">Done</button></div>
  </div>

  <!-- Legend (design: bottom left pill) -->
  <div id="legend"><span data-i18n="legendMatch">Crop match</span> <span class="grad"></span> <span data-i18n="legendScale">poor → good</span> · <span data-i18n="legendZones">zones approximate</span></div>

  <!-- Result panel (desktop: right side, phone: bottom sheet) -->
  <aside id="panel" aria-label="Crop result">
    <div class="handle-zone" id="handle" role="button" tabindex="0" aria-label="Expand or collapse"><span class="handle"></span></div>
    <div id="panelBody"></div>
    <!-- "?" explanations: how each answer is calculated -->
    <div id="info" class="info" role="dialog" aria-modal="true" aria-labelledby="infoTitle" hidden></div>
  </aside>
</div>
<!-- page change: our logo draws itself while the next page is prepared (built by ui.js) -->
<div id="ld" aria-hidden="true"></div>

<script id="data" type="application/json">{{DATA}}</script>
<script id="photos" type="application/json">{{PHOTOS}}</script>
<script id="logo" type="text/plain">{{LOGO}}</script>
<script>/*I18N*/</script>
<script>/*JS*/</script>
</body>
</html>
